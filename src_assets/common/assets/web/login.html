<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
  <%- header %>
</head>

<body id="app" v-cloak>
  <main role="main" style="max-width: 1200px; margin: 1em auto">
    <div class="d-flex justify-content-center">
      <div class="card p-2">
        <header>
          <h1 class="mb-0">
            <img src="/images/logo-apollo-45.png" height="45" alt="">
            {{ $t('welcome.greeting') }}
          </h1>
        </header>
        <form @submit.prevent="login" class="mt-4">
          <div class="mb-2">
            <label for="usernameInput" class="form-label">{{ $t('_common.username') }}</label>
            <input type="text" class="form-control" id="usernameInput" autocomplete="username"
              v-model="passwordData.username" required autofocus/>
          </div>
          <div class="mb-2">
            <label for="passwordInput" class="form-label">{{ $t('_common.password') }}</label>
            <input type="password" class="form-control" id="passwordInput" autocomplete="current-password"
              v-model="passwordData.password" required />
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-2" v-bind:disabled="loading">
            {{ $t('welcome.login') }}
          </button>
          <div class="alert alert-danger" v-if="error"><b>{{ $t('_common.error') }}</b> {{error}}</div>
          <div class="alert alert-success" v-if="success">
            <b>{{ $t('_common.success') }}</b> {{ $t('welcome.login_success') }}
          </div>
        </form>
      </div>
    </div>
  </main>
</body>

<script type="module">
  import { createApp, ref, onMounted } from "vue"
  import { loadAutoTheme } from './theme'
  import { initApp } from './init'

  let app = createApp({
    setup() {
      loadAutoTheme()

      const error = ref('');
      const success = ref(false);
      const loading = ref(false);

      const data = {
        error,
        success,
        loading,
        passwordData: {
          username: '',
          password: ''
        }
      }

      // Earlier versions could keep the password here in plain text; the browser's password manager
      // stores it safely instead (the form's autocomplete hints help it)
      try {
        localStorage.removeItem('login');
      } catch (e) {
        console.error('Clearing the saved password failed!', e);
      }

      return data
    },
    methods: {
      login() {
        this.error = null;
        this.loading = true;
        fetch("./api/login", {
          headers: {
            'Content-Type': 'application/json'
          },
          method: 'POST',
          body: JSON.stringify(this.passwordData),
        }).then((res) => {
          this.loading = false;
          if (res.status === 200) {
            this.success = true;
            const url = new URL(window.location);
            const redirectUrl = url.searchParams.get('redir');
            const hash = url.hash;
            if (redirectUrl && redirectUrl.startsWith('.')) {
              location.href = redirectUrl + hash;
            } else {
              location.href = './' + hash;
            }
          } else {
            if (res.status === 401) {
              throw new Error('Please check your username and password')
            } else if (res.status === 429) {
              throw new Error(`Too many failed attempts; try again in ${res.headers.get('Retry-After') || 'a few'} seconds`)
            } else {
              throw new Error(`Server returned ${res.status}`);
            }
          }
        }).catch((e) => {
          this.error = `Login failed: ${e.message}`;
        });
      },
    },
  });

  initApp(app);
</script>
