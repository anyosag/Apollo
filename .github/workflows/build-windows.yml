---
# Builds the Windows installer and portable zip from the current source,
# following the steps in docs/building.md.
name: Build Windows

on:
  push:
    branches:
      - master
      - 'claude/**'
  workflow_dispatch:
  # Used by sync-upstream.yml, since pushes made with GITHUB_TOKEN don't trigger workflows.
  workflow_call:
    inputs:
      ref:
        description: Commit to build (defaults to the commit that triggered the run)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_windows:
    name: Windows x64
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write  # sign the build provenance
      attestations: write  # store it
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: recursive

      # Fixes the fork carries in submodules it doesn't own (patches/, see FORK.md)
      - name: Apply submodule patches
        shell: bash
        run: bash scripts/fork/apply-patches.sh

      # Version is the latest upstream release plus the number of commits since it,
      # e.g. 0.4.8.26, so Apollo's update check compares correctly against upstream releases.
      - name: Determine version
        shell: bash
        run: |
          git fetch --quiet --tags https://github.com/ClassicOldSong/Apollo.git
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*')
          version="${tag#v}.$(git rev-list --count "$tag..HEAD")"
          echo "Building version $version"
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # The LuzVDA virtual display driver (anyosag/LuzVDA). Its CI builds it unsigned; its owner signs it on
      # their own PC and publishes the signed zip as a release. The source tree has only install.bat,
      # uninstall.bat and the public certificate; the driver comes from that release, pinned by SHA256.
      - name: Add LuzVDA driver
        shell: pwsh
        env:
          LUZVDA_RELEASE: signed-0.0.0.9
          LUZVDA_ZIP: LuzVDA-0.0.0.9.zip
          LUZVDA_ZIP_SHA256: 2aa6d98c44d5dc5615b668cc7a5cb2db939f8e13c3fcd098919dd0319409893a
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP $env:LUZVDA_ZIP
          $extracted = Join-Path $env:RUNNER_TEMP 'luzvda'
          Invoke-WebRequest "https://github.com/anyosag/LuzVDA/releases/download/$env:LUZVDA_RELEASE/$env:LUZVDA_ZIP" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:LUZVDA_ZIP_SHA256) { throw "$env:LUZVDA_ZIP from $env:LUZVDA_RELEASE has unexpected SHA256 $hash" }
          Expand-Archive $zip -DestinationPath $extracted -Force

          # Signed with the certificate the installer trusts. The runner doesn't trust it, so the
          # signature's status isn't Valid here; its signer must still be that certificate.
          $driverDir = 'src_assets/windows/drivers/luzvda'
          $trusted = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path "$driverDir/luzvda.cer").Path)
          $shipped = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path "$extracted/luzvda.cer").Path)
          if ($shipped.Thumbprint -ne $trusted.Thumbprint) { throw "The release's luzvda.cer isn't $driverDir/luzvda.cer ($($trusted.Thumbprint))" }
          foreach ($file in 'LuzVDA.dll', 'luzvda.cat', 'luzvda-ctl.exe') {
            $signer = (Get-AuthenticodeSignature "$extracted/$file").SignerCertificate
            if (-not $signer -or $signer.Thumbprint -ne $trusted.Thumbprint) { throw "$file isn't signed with $driverDir/luzvda.cer" }
          }

          # Apollo talks to the driver through the same protocol header, line endings aside
          $released = (Get-Content -Raw "$extracted/luzvda-ioctl.h") -replace "`r`n", "`n"
          $ours = (Get-Content -Raw 'third-party/luzvda/luzvda-ioctl.h') -replace "`r`n", "`n"
          if ($released -ne $ours) { throw "third-party/luzvda/luzvda-ioctl.h differs from the one in $env:LUZVDA_RELEASE" }

          foreach ($file in 'LuzVDA.inf', 'LuzVDA.dll', 'luzvda.cat', 'luzvda-ctl.exe') { Copy-Item "$extracted/$file" $driverDir }
          Get-ChildItem $driverDir | Format-Table Name, Length

      # MSYS2's nodejs crashes on startup (gcc-16 libstdc++ regression), so use the official build.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: lts/*

      - name: Locate Node.js
        shell: pwsh
        run: |
          $nodeDir = Split-Path (Get-Command node).Source
          "NODE_DIR=$nodeDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Boost is left out on purpose: the build needs exactly 1.89.0 and fetches it itself.
      - name: Setup MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nlohmann_json
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-zlib

      # Fork code that doesn't need the rest of Apollo: the clipboard bundle and trackpad frames
      # (shared with LuzLunar), a round trip through the real Windows clipboard, and gestures on a
      # real synthetic touchpad; the last two skip if the runner has no clipboard or touchpads.
      - name: Fork unit tests
        shell: msys2 {0}
        run: |
          # Stop at the first failing test or header, whatever flags the MSYS2 shell runs with
          set -eo pipefail
          g++ -std=c++17 -Wall -Wextra -DCLIPBUNDLE_WITH_ZLIB -Isrc/fork \
            tests/fork/clipbundle_test.cpp src/fork/clipbundle.cpp -lz -o clipbundle_test
          ./clipbundle_test
          # Trackpad passthrough frames, also shared with LuzLunar (the same test runs in its CI)
          g++ -std=c++17 -Wall -Wextra -Isrc/fork tests/fork/luztouchpad_test.cpp -o luztouchpad_test
          ./luztouchpad_test
          g++ -std=c++17 -Wall -DCLIPBUNDLE_WITH_ZLIB -Isrc/fork \
            tests/fork/clipboard_win_smoke.cpp src/fork/clipboard_win.cpp src/fork/clipbundle.cpp \
            -lz -lole32 -luser32 -o clipboard_win_smoke
          ./clipboard_win_smoke
          # A real synthetic touchpad playing trackpad passthrough's gestures; skips where Windows has none
          g++ -std=c++17 -Wall -Isrc/fork tests/fork/touchpad_win_smoke.cpp -luser32 -o touchpad_win_smoke
          ./touchpad_win_smoke
          # Header-only fork code; each test is a program of its own
          for test in tests/fork/header/*_test.cpp; do
            name=$(basename "$test" .cpp)
            g++ -std=c++23 -Wall -Wextra -iquote src -Ithird-party "$test" -lcrypto -o "$name"
            "./$name"
          done
          # Each fork header on its own with the build's include paths (the repository root and
          # third-party; the tests above also have src/), so one that builds only in the tests fails here
          for header in src/fork/*.h; do
            echo "#include \"$header\"" | g++ -std=c++23 -fsyntax-only -iquote . -Ithird-party -x c++ -
          done

      - name: Build
        shell: msys2 {0}
        env:
          BRANCH: ${{ github.ref_name }}
          CLONE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          export PATH="$PATH:$(cygpath -u "$NODE_DIR")"
          node --version
          gcc --version | head -n 1
          cmake --version | head -n 1

          # CMAKE_POLICY_VERSION_MINIMUM lets CMake 4 configure submodules that still declare CMake < 3.5
          cmake -B build -G Ninja -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=OFF
          ninja -C build

      - name: Package
        shell: msys2 {0}
        run: |
          cd build
          cpack -G NSIS
          cpack -G ZIP

          mkdir -p ../artifacts
          mv ./cpack_artifacts/Apollo.exe ../artifacts/Apollo-windows-installer.exe
          mv ./cpack_artifacts/Apollo.zip ../artifacts/Apollo-windows-portable.zip
          cd ../artifacts
          sha256sum Apollo-windows-installer.exe Apollo-windows-portable.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Check driver is packaged
        shell: pwsh
        run: |
          $files = 'LuzVDA.inf', 'LuzVDA.dll', 'luzvda.cat', 'luzvda-ctl.exe', 'luzvda.cer', 'install.bat', 'uninstall.bat'
          foreach ($package in 'Apollo-windows-installer.exe', 'Apollo-windows-portable.zip') {
            $listing = 7z l "artifacts/$package"
            foreach ($file in $files) {
              if (-not ($listing -match "drivers\\luzvda\\$([regex]::Escape($file))")) { throw "$package is missing drivers\luzvda\$file" }
            }
          }
          "Both packages include the LuzVDA driver: $($files -join ', ')"

      # Lets anyone check a downloaded installer came from this workflow:
      #   gh attestation verify Apollo-windows-installer.exe -R anyosag/Apollo
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            artifacts/Apollo-windows-installer.exe
            artifacts/Apollo-windows-portable.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: Apollo-windows-${{ env.BUILD_VERSION }}
          path: artifacts/
          if-no-files-found: error
