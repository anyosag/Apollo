---
# Builds the Windows installer and portable zip from the current source,
# following the steps in docs/building.md.
name: Build Windows

on:
  push:
    branches:
      - master
      - 'claude/**'
  workflow_dispatch:
  # Used by sync-upstream.yml, since pushes made with GITHUB_TOKEN don't trigger workflows.
  workflow_call:
    inputs:
      ref:
        description: Commit to build (defaults to the commit that triggered the run)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_windows:
    name: Windows x64
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write  # sign the build provenance
      attestations: write  # store it
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # The "US - Mac" keyboard layout (FORK.md, "Keyboard layout for LuzLunar"), built with Visual Studio into
      # src_assets/windows/keyboard/ for the installer. Before the long steps, so a broken one fails fast.
      - name: Build the keyboard layout
        shell: pwsh
        run: scripts/fork/build-keyboard-layout.ps1 -TestDir "$env:RUNNER_TEMP\keyboard-tests"

      # Reads both DLLs' tables; installs the layout with the installer's script, from 32-bit PowerShell as
      # the installer starts it; checks it through Windows against the runner's US layout; installs again;
      # and removes it with the uninstaller's script after adding it to the runner's keyboards.
      - name: Keyboard layout tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = "$env:RUNNER_TEMP\keyboard-tests"
          $layout = 'src_assets\windows\keyboard'
          $layouts = 'HKLM:\SYSTEM\CurrentControlSet\Control\Keyboard Layouts'
          $powershell32 = "$env:SystemRoot\SysWOW64\WindowsPowerShell\v1.0\powershell.exe"
          function Invoke-Checked([string]$what, [scriptblock]$command) {
            & $command
            if ($LASTEXITCODE -ne 0) { throw "$what failed with exit code $LASTEXITCODE" }
          }
          function Get-Registered {
            @(Get-ChildItem $layouts | Where-Object { $_.GetValue('Layout File') -eq 'kbdluzus.dll' } | ForEach-Object { $_.PSChildName })
          }

          Invoke-Checked 'The 64-bit tables test' { & "$tests\keyboard_layout_tables_test.exe" "$layout\kbdluzus.dll" }
          Invoke-Checked 'The WOW64 tables test' { & "$tests\keyboard_layout_tables_test_wow64.exe" "$layout\wow64\kbdluzus.dll" }

          Invoke-Checked 'install.ps1' { & $powershell32 -NoProfile -ExecutionPolicy Bypass -File "$layout\install.ps1" }
          foreach ($copy in @{ System32 = 'kbdluzus.dll'; SysWOW64 = 'wow64\kbdluzus.dll' }.GetEnumerator()) {
            if ((Get-FileHash "$env:SystemRoot\$($copy.Key)\kbdluzus.dll").Hash -ne (Get-FileHash "$layout\$($copy.Value)").Hash) {
              throw "$($copy.Key) doesn't have the built $($copy.Value)"
            }
          }
          $klid = @(Get-Registered)
          if ($klid.Count -ne 1) { throw "install.ps1 registered $($klid.Count) layouts" }
          $klid = $klid[0]
          Get-ItemProperty "$layouts\$klid" | Format-List 'Layout*'

          Invoke-Checked 'The smoke test' { & "$tests\keyboard_layout_win_smoke.exe" $klid }

          Invoke-Checked 'install.ps1 again' { & $powershell32 -NoProfile -ExecutionPolicy Bypass -File "$layout\install.ps1" }
          $again = @(Get-Registered)
          if ($again.Count -ne 1 -or $again[0] -ne $klid) { throw "Installing again left $($again -join ', ') instead of $klid" }

          $list = Get-WinUserLanguageList
          $language = ($list[0].InputMethodTips[0] -split ':')[0]
          $list[0].InputMethodTips.Add("${language}:$klid")
          Set-WinUserLanguageList $list -Force
          if (-not ((Get-WinUserLanguageList).InputMethodTips -like "*:$klid")) { throw "Couldn't add $klid to the runner's keyboards" }
          Invoke-Checked 'uninstall.ps1' { & $powershell32 -NoProfile -ExecutionPolicy Bypass -File "$layout\uninstall.ps1" }
          if (Get-Registered) { throw 'uninstall.ps1 left the layout registered' }
          if ((Get-WinUserLanguageList).InputMethodTips -like "*:$klid") { throw "uninstall.ps1 left $klid on the runner's keyboards" }
          foreach ($folder in 'System32', 'SysWOW64') {
            if (Test-Path "$env:SystemRoot\$folder\kbdluzus.dll") { throw "uninstall.ps1 left $folder\kbdluzus.dll" }
          }
          "install.ps1 and uninstall.ps1 work; the layout was $klid"

      # Every submodule but the Linux-only Wayland protocols, which Windows doesn't build. Their host,
      # gitlab.freedesktop.org, sometimes times out and failed the checkout. Only the pinned commit of
      # each (nothing reads their history), several at once.
      - name: Checkout submodules
        shell: bash
        run: |
          git config submodule.third-party/wayland-protocols.update none
          git config submodule.third-party/wlr-protocols.update none
          git submodule update --init --recursive --depth 1 --jobs 8

      # Fixes the fork carries in submodules it doesn't own (patches/, see FORK.md)
      - name: Apply submodule patches
        shell: bash
        run: bash scripts/fork/apply-patches.sh

      # Version is the latest upstream release plus the number of commits since it,
      # e.g. 0.4.8.26, so Apollo's update check compares correctly against upstream releases.
      # The run number orders builds for over-the-air updates (src/fork/updater.cpp). A master build,
      # which updates may replace by themselves and the publish job releases, is a push to master or a
      # run started by hand on master (Run workflow, for a push GitHub didn't act on). Sync upstream's
      # builds never are: a called workflow sees its caller's name in github.workflow.
      - name: Determine version
        id: version
        shell: bash
        env:
          FORK_BUILD_RUN: ${{ github.run_number }}
          IS_MASTER_BUILD: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.workflow == 'Build Windows')) }}
        run: |
          git fetch --quiet --tags https://github.com/ClassicOldSong/Apollo.git
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*')
          version="${tag#v}.$(git rev-list --count "$tag..HEAD")"
          channel=branch
          if [ "$IS_MASTER_BUILD" = true ]; then channel=master; fi
          echo "Building version $version, run $FORK_BUILD_RUN ($channel)"
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "FORK_BUILD_RUN=$FORK_BUILD_RUN" >> "$GITHUB_ENV"
          echo "FORK_BUILD_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      # The LuzVDA virtual display driver (anyosag/LuzVDA). Its CI builds it unsigned; its owner signs it on
      # their own PC and publishes the signed zip as a release. The source tree has only install.bat,
      # uninstall.bat and the public certificate; the driver comes from that release, pinned by SHA256.
      - name: Add LuzVDA driver
        shell: pwsh
        env:
          LUZVDA_RELEASE: signed-0.0.0.9
          LUZVDA_ZIP: LuzVDA-0.0.0.9.zip
          LUZVDA_ZIP_SHA256: 2aa6d98c44d5dc5615b668cc7a5cb2db939f8e13c3fcd098919dd0319409893a
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP $env:LUZVDA_ZIP
          $extracted = Join-Path $env:RUNNER_TEMP 'luzvda'
          Invoke-WebRequest "https://github.com/anyosag/LuzVDA/releases/download/$env:LUZVDA_RELEASE/$env:LUZVDA_ZIP" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:LUZVDA_ZIP_SHA256) { throw "$env:LUZVDA_ZIP from $env:LUZVDA_RELEASE has unexpected SHA256 $hash" }
          Expand-Archive $zip -DestinationPath $extracted -Force

          # Signed with the certificate the installer trusts. The runner doesn't trust it, so the
          # signature's status isn't Valid here; its signer must still be that certificate.
          $driverDir = 'src_assets/windows/drivers/luzvda'
          $trusted = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path "$driverDir/luzvda.cer").Path)
          $shipped = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path "$extracted/luzvda.cer").Path)
          if ($shipped.Thumbprint -ne $trusted.Thumbprint) { throw "The release's luzvda.cer isn't $driverDir/luzvda.cer ($($trusted.Thumbprint))" }
          foreach ($file in 'LuzVDA.dll', 'luzvda.cat', 'luzvda-ctl.exe') {
            $signer = (Get-AuthenticodeSignature "$extracted/$file").SignerCertificate
            if (-not $signer -or $signer.Thumbprint -ne $trusted.Thumbprint) { throw "$file isn't signed with $driverDir/luzvda.cer" }
          }

          # Apollo talks to the driver through the same protocol header, line endings aside
          $released = (Get-Content -Raw "$extracted/luzvda-ioctl.h") -replace "`r`n", "`n"
          $ours = (Get-Content -Raw 'third-party/luzvda/luzvda-ioctl.h') -replace "`r`n", "`n"
          if ($released -ne $ours) { throw "third-party/luzvda/luzvda-ioctl.h differs from the one in $env:LUZVDA_RELEASE" }

          foreach ($file in 'LuzVDA.inf', 'LuzVDA.dll', 'luzvda.cat', 'luzvda-ctl.exe') { Copy-Item "$extracted/$file" $driverDir }
          Get-ChildItem $driverDir | Format-Table Name, Length

      # MSYS2's nodejs crashes on startup (gcc-16 libstdc++ regression), so use the official build.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: lts/*

      - name: Locate Node.js
        shell: pwsh
        run: |
          $nodeDir = Split-Path (Get-Command node).Source
          "NODE_DIR=$nodeDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Boost is left out on purpose: the build needs exactly 1.89.0 and fetches it itself.
      - name: Setup MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nlohmann_json
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-ccache

      # Fork code that doesn't need the rest of Apollo: the clipboard bundle and trackpad frames
      # (shared with LuzLunar), a round trip through the real Windows clipboard, and gestures on a
      # real synthetic touchpad; the last two skip if the runner has no clipboard or touchpads.
      - name: Fork unit tests
        shell: msys2 {0}
        run: |
          # Stop at the first failing test or header, whatever flags the MSYS2 shell runs with
          set -eo pipefail
          g++ -std=c++17 -Wall -Wextra -DCLIPBUNDLE_WITH_ZLIB -Isrc/fork \
            tests/fork/clipbundle_test.cpp src/fork/clipbundle.cpp -lz -o clipbundle_test
          ./clipbundle_test
          # Trackpad passthrough frames, also shared with LuzLunar (the same test runs in its CI)
          g++ -std=c++17 -Wall -Wextra -Isrc/fork tests/fork/luztouchpad_test.cpp -o luztouchpad_test
          ./luztouchpad_test
          g++ -std=c++17 -Wall -DCLIPBUNDLE_WITH_ZLIB -Isrc/fork \
            tests/fork/clipboard_win_smoke.cpp src/fork/clipboard_win.cpp src/fork/clipbundle.cpp \
            -lz -lole32 -luser32 -o clipboard_win_smoke
          ./clipboard_win_smoke
          # A real synthetic touchpad playing trackpad passthrough's gestures; skips where Windows has none.
          # Static, so the uploaded copy runs on a PC without MSYS2.
          g++ -std=c++17 -Wall -static -Isrc/fork tests/fork/touchpad_win_smoke.cpp -luser32 -o touchpad_win_smoke
          ./touchpad_win_smoke
          # Header-only fork code; each test is a program of its own
          for test in tests/fork/header/*_test.cpp; do
            name=$(basename "$test" .cpp)
            g++ -std=c++23 -Wall -Wextra -iquote src -Ithird-party "$test" -lcrypto -o "$name"
            "./$name"
          done
          # Each fork header on its own with the build's include paths (the repository root and
          # third-party; the tests above also have src/), so one that builds only in the tests fails here
          for header in src/fork/*.h; do
            echo "#include \"$header\"" | g++ -std=c++23 -fsyntax-only -iquote . -Ithird-party -x c++ -
          done

      # The compiler cache, kept between runs: most commits change a few files, so most of the build
      # comes from it. Each run saves its own copy; the next run starts from the newest one its branch,
      # or master, has. The version, commit and run go in a generated header only three files include
      # (cmake/prep/build_version.cmake), so the other files' compile commands stay the same.
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-windows-x64-${{ github.run_id }}
          restore-keys: ccache-windows-x64-

      - name: Build
        shell: msys2 {0}
        env:
          BRANCH: ${{ github.ref_name }}
          CLONE_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 2G
        run: |
          export PATH="$PATH:$(cygpath -u "$NODE_DIR")"
          node --version
          gcc --version | head -n 1
          cmake --version | head -n 1
          ccache --version | head -n 1
          # This run's hits and misses only
          ccache --zero-stats

          # CMAKE_POLICY_VERSION_MINIMUM lets CMake 4 configure submodules that still declare CMake < 3.5
          cmake -B build -G Ninja -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=OFF
          ninja -C build
          ccache --show-stats

      # The Mac drive's helper against a real SMB share on this runner: a local account shares a
      # folder, which the helper maps through 127.0.0.1 the way it maps LuzLunar's Mac, and removes
      # again; a wrong password, a missing share and open files answer as Apollo expects
      # (src/fork/mac_drive_policy.h)
      - name: Mac drive helper smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = (Resolve-Path build/tools/apollo-mac-drive.exe).Path
          $account = 'luzdrive'
          # 14 characters: net user asks for confirmation (and fails without a console) above that
          $password = 'Lz!' + [guid]::NewGuid().ToString('N').Substring(0, 9) + 'a1'
          $share = 'LuzDriveTest'
          $dir = Join-Path $env:RUNNER_TEMP 'luzdrive-share'
          $labelKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\MountPoints2\##127.0.0.1#$share"

          function Start-Helper {
            $info = [System.Diagnostics.ProcessStartInfo]::new($helper)
            $info.RedirectStandardInput = $true
            $info.RedirectStandardOutput = $true
            $info.UseShellExecute = $false
            [System.Diagnostics.Process]::Start($info)
          }
          function Send($process, $line) {
            $process.StandardInput.WriteLine($line)
            $process.StandardInput.Flush()
          }
          function Read-Answer($process) {
            while ($true) {
              $line = $process.StandardOutput.ReadLine()
              if ($null -eq $line) { throw 'the helper ended without answering' }
              if (-not $line.StartsWith('{')) { Write-Host "helper: $line"; continue }
              Write-Host "helper answers: $line"
              return $line | ConvertFrom-Json
            }
          }
          function Map-Line($shareName, $secret) {
            @{ cmd = 'map'; letter = 'M'; host = '127.0.0.1'; shares = @($shareName); user = $account; password = $secret; label = 'CI Mac' } | ConvertTo-Json -Compress
          }
          function Expect($answer, $result) {
            if ($answer.result -ne $result) { throw "expected $result, got $($answer | ConvertTo-Json -Compress)" }
          }

          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -Path (Join-Path $dir 'hello.txt') -Value 'from the share'
          net user $account $password /add | Out-Null
          if ($LASTEXITCODE) { throw "couldn't add the local account $account" }
          try {
            icacls $dir /grant "${account}:(OI)(CI)F" | Out-Null
            net share "$share=$dir" "/grant:$account,FULL" | Out-Null
            if ($LASTEXITCODE) { throw "couldn't share $dir" }

            # First, before any sign-in succeeds (Windows could reuse that session): a wrong password,
            # then a share the server doesn't have
            $process = Start-Helper
            Send $process (Map-Line $share 'not-the-password')
            $answer = Read-Answer $process
            Expect $answer 'failed'
            # A sign-in failure, as mac_drive_policy.h classifies it: Windows' SMB server says 86
            if ($answer.code -notin 86, 1326) { throw "a wrong password gave error $($answer.code), not 86 or 1326" }
            $process = Start-Helper
            Send $process (Map-Line 'NoSuchShare' $password)
            $answer = Read-Answer $process
            Expect $answer 'failed'
            if ($answer.code -ne 67) { throw "a missing share gave error $($answer.code), not 67" }

            # Mapped, readable through its letter and named for Explorer
            $process = Start-Helper
            Send $process (Map-Line $share $password)
            $answer = Read-Answer $process
            Expect $answer 'mapped'
            $letter = $answer.letter
            $content = Get-Content "${letter}:\hello.txt"
            if ($content -ne 'from the share') { throw "read [$content] through ${letter}:" }
            $label = (Get-ItemProperty $labelKey)._LabelFromReg
            if ($label -ne 'CI Mac') { throw "Explorer's label is [$label]" }

            # A file held open keeps the drive, until the removal is forced
            $file = [System.IO.File]::Open("${letter}:\hello.txt", 'Open', 'Read', 'ReadWrite')
            try {
              Send $process '{"cmd":"unmap"}'
              Expect (Read-Answer $process) 'in-use'
              if (-not (Test-Path "${letter}:\")) { throw "${letter}: went with a file open" }
              Send $process '{"cmd":"unmap","force":true}'
              Expect (Read-Answer $process) 'unmapped'
            } finally {
              try { $file.Dispose() } catch { }
            }
            if (-not $process.WaitForExit(10000)) { throw "the helper didn't exit" }
            if (Test-Path "${letter}:\") { throw "${letter}: is still there" }
            if ($null -ne (Get-ItemProperty $labelKey -ErrorAction SilentlyContinue)._LabelFromReg) { throw "Explorer's label is still there" }

            # Apollo stopping (the end of the helper's input) removes the drive
            $process = Start-Helper
            Send $process (Map-Line $share $password)
            $answer = Read-Answer $process
            Expect $answer 'mapped'
            $letter = $answer.letter
            $process.StandardInput.Close()
            Expect (Read-Answer $process) 'unmapped'
            if (-not $process.WaitForExit(10000)) { throw "the helper didn't exit" }
            if (Test-Path "${letter}:\") { throw "${letter}: is still there after the helper's input ended" }
            'The Mac drive helper fails, maps, names, keeps with files open and removes as expected'
          } finally {
            net share $share /delete /y 2>$null | Out-Null
            net user $account /delete 2>$null | Out-Null
          }
          exit 0

      - name: Package
        shell: msys2 {0}
        run: |
          cd build
          cpack -G NSIS
          cpack -G ZIP

          mkdir -p ../artifacts
          mv ./cpack_artifacts/Apollo.exe ../artifacts/Apollo-windows-installer.exe
          mv ./cpack_artifacts/Apollo.zip ../artifacts/Apollo-windows-portable.zip
          cd ../artifacts
          sha256sum Apollo-windows-installer.exe Apollo-windows-portable.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Check drivers are packaged
        shell: pwsh
        run: |
          $files = 'luzvda\LuzVDA.inf', 'luzvda\LuzVDA.dll', 'luzvda\luzvda.cat', 'luzvda\luzvda-ctl.exe', 'luzvda\luzvda.cer',
            'luzvda\install.bat', 'luzvda\uninstall.bat',
            'keyboard\kbdluzus.dll', 'keyboard\wow64\kbdluzus.dll', 'keyboard\install.ps1', 'keyboard\uninstall.ps1'
          foreach ($package in 'Apollo-windows-installer.exe', 'Apollo-windows-portable.zip') {
            $listing = 7z l "artifacts/$package"
            foreach ($file in $files) {
              if (-not ($listing -match "drivers\\$([regex]::Escape($file))")) { throw "$package is missing drivers\$file" }
            }
          }
          "Both packages include the LuzVDA driver and the US - Mac keyboard layout: $($files -join ', ')"

      # Lets anyone check a downloaded installer came from this workflow:
      #   gh attestation verify Apollo-windows-installer.exe -R anyosag/Apollo
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            artifacts/Apollo-windows-installer.exe
            artifacts/Apollo-windows-portable.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: Apollo-windows-${{ env.BUILD_VERSION }}
          path: artifacts/
          if-no-files-found: error

      # The touchpad smoke test from the fork unit test step, to run by hand on a PC (see FORK.md)
      - name: Upload the touchpad smoke test
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: Apollo-touchpad-smoke-${{ env.BUILD_VERSION }}
          path: touchpad_win_smoke.exe
          if-no-files-found: warn

  # Over-the-air updates (FORK.md, "Updates"): each master build becomes a GitHub release with an
  # update.json that Apollo checks against the public key in src/fork/update_key.h. The signing key
  # is the FORK_UPDATE_KEY secret of the `release` environment, which only master may use.
  publish:
    name: Publish update
    needs: build_windows
    if: needs.build_windows.outputs.channel == 'master' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write  # create the release
    concurrency:
      group: publish-update
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          sparse-checkout: src/fork/update_key.h
          sparse-checkout-cone-mode: false

      - name: Download the build
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: Apollo-windows-${{ needs.build_windows.outputs.version }}
          path: artifacts

      - name: Write and sign update.json
        id: sign
        env:
          FORK_UPDATE_KEY: ${{ secrets.FORK_UPDATE_KEY }}
          RUN: ${{ github.run_number }}
          VERSION: ${{ needs.build_windows.outputs.version }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "$FORK_UPDATE_KEY" ]; then
            echo "::warning::The release environment has no FORK_UPDATE_KEY secret, so this build isn't published as an update (FORK.md, \"Updates\")"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd artifacts
          file=Apollo-windows-installer.exe
          tag="apollo-b$RUN"
          notes="${HEAD_MESSAGE%%$'\n'*}"
          notes="${notes:0:500}"
          jq -n \
            --argjson run "$RUN" --arg version "$VERSION" --arg commit "$COMMIT" \
            --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg notes "$notes" \
            --arg name "$file" --arg url "https://github.com/$REPO/releases/download/$tag/$file" \
            --arg sha256 "$(sha256sum "$file" | cut -d' ' -f1)" --argjson size "$(stat -c %s "$file")" \
            '{product: "apollo", channel: "master", run: $run, version: $version, commit: $commit,
              published: $published, notes: $notes,
              asset: {name: $name, url: $url, sha256: $sha256, size: $size}}' > update.json
          cat update.json

          key="$RUNNER_TEMP/update-key.pem"
          (umask 077; printf '%s\n' "$FORK_UPDATE_KEY" > "$key")
          openssl pkeyutl -sign -inkey "$key" -rawin -in update.json -out "$RUNNER_TEMP/update.sig"
          rm -f "$key"
          base64 -w0 "$RUNNER_TEMP/update.sig" > update.json.sig

          # The secret must match the public key Apollo has, or every Apollo would refuse this update
          hex=$(grep -o '0x[0-9a-f][0-9a-f]' ../src/fork/update_key.h | head -n 32 | sed 's/0x//' | tr -d '\n')
          { echo '-----BEGIN PUBLIC KEY-----'; echo "302a300506032b6570032100$hex" | xxd -r -p | base64; echo '-----END PUBLIC KEY-----'; } > "$RUNNER_TEMP/update-pub.pem"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/update-pub.pem" -rawin -in update.json -sigfile "$RUNNER_TEMP/update.sig"

          {
            echo "publish=true"
            echo "tag=$tag"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"

      - name: Create the release
        if: steps.sign.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.sign.outputs.tag }}
          NOTES: ${{ steps.sign.outputs.notes }}
          VERSION: ${{ needs.build_windows.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd artifacts
          files=(Apollo-windows-installer.exe Apollo-windows-portable.zip SHA256SUMS.txt update.json update.json.sig)
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"
          else
            gh release create "$TAG" --repo "$REPO" --target "$COMMIT" --title "Apollo $VERSION" \
              --notes "$NOTES" --latest "${files[@]}"
          fi

          # Keep the newest 15 updates; older ones are no longer needed to roll back to
          gh release list --repo "$REPO" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("apollo-b"))] | sort_by(.createdAt) | reverse | .[15:] | .[].tagName' |
          while read -r old; do
            echo "Removing $old"
            gh release delete "$old" --repo "$REPO" --yes --cleanup-tag
          done
