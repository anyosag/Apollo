---
# Builds the Windows installer and portable zip from the current source,
# following the steps in docs/building.md.
name: Build Windows

on:
  push:
    branches:
      - master
      - 'claude/**'
  workflow_dispatch:
  # Used by sync-upstream.yml, since pushes made with GITHUB_TOKEN don't trigger workflows.
  workflow_call:
    inputs:
      ref:
        description: Commit to build (defaults to the commit that triggered the run)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_windows:
    name: Windows x64
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write  # sign the build provenance
      attestations: write  # store it
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # Every submodule but the Linux-only Wayland protocols, which Windows doesn't build. Their host,
      # gitlab.freedesktop.org, sometimes times out and failed the checkout.
      - name: Checkout submodules
        shell: bash
        run: |
          git config submodule.third-party/wayland-protocols.update none
          git config submodule.third-party/wlr-protocols.update none
          git submodule update --init --recursive

      # Fixes the fork carries in submodules it doesn't own (patches/, see FORK.md)
      - name: Apply submodule patches
        shell: bash
        run: bash scripts/fork/apply-patches.sh

      # Version is the latest upstream release plus the number of commits since it,
      # e.g. 0.4.8.26, so Apollo's update check compares correctly against upstream releases.
      # The run number orders builds for over-the-air updates (src/fork/updater.cpp); only a push to
      # master is a master build, which updates may replace by themselves and the publish job releases.
      - name: Determine version
        id: version
        shell: bash
        env:
          FORK_BUILD_RUN: ${{ github.run_number }}
          IS_MASTER_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          git fetch --quiet --tags https://github.com/ClassicOldSong/Apollo.git
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*')
          version="${tag#v}.$(git rev-list --count "$tag..HEAD")"
          channel=branch
          if [ "$IS_MASTER_PUSH" = true ]; then channel=master; fi
          echo "Building version $version, run $FORK_BUILD_RUN ($channel)"
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "FORK_BUILD_RUN=$FORK_BUILD_RUN" >> "$GITHUB_ENV"
          echo "FORK_BUILD_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The LuzVDA virtual display driver (anyosag/LuzVDA). Its CI builds it unsigned; its owner signs it on
      # their own PC and publishes the signed zip as a release. The source tree has only install.bat,
      # uninstall.bat and the public certificate; the driver comes from that release, pinned by SHA256.
      - name: Add LuzVDA driver
        shell: pwsh
        env:
          LUZVDA_RELEASE: signed-0.0.0.9
          LUZVDA_ZIP: LuzVDA-0.0.0.9.zip
          LUZVDA_ZIP_SHA256: 2aa6d98c44d5dc5615b668cc7a5cb2db939f8e13c3fcd098919dd0319409893a
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP $env:LUZVDA_ZIP
          $extracted = Join-Path $env:RUNNER_TEMP 'luzvda'
          Invoke-WebRequest "https://github.com/anyosag/LuzVDA/releases/download/$env:LUZVDA_RELEASE/$env:LUZVDA_ZIP" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:LUZVDA_ZIP_SHA256) { throw "$env:LUZVDA_ZIP from $env:LUZVDA_RELEASE has unexpected SHA256 $hash" }
          Expand-Archive $zip -DestinationPath $extracted -Force

          # Signed with the certificate the installer trusts. The runner doesn't trust it, so the
          # signature's status isn't Valid here; its signer must still be that certificate.
          $driverDir = 'src_assets/windows/drivers/luzvda'
          $trusted = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path "$driverDir/luzvda.cer").Path)
          $shipped = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path "$extracted/luzvda.cer").Path)
          if ($shipped.Thumbprint -ne $trusted.Thumbprint) { throw "The release's luzvda.cer isn't $driverDir/luzvda.cer ($($trusted.Thumbprint))" }
          foreach ($file in 'LuzVDA.dll', 'luzvda.cat', 'luzvda-ctl.exe') {
            $signer = (Get-AuthenticodeSignature "$extracted/$file").SignerCertificate
            if (-not $signer -or $signer.Thumbprint -ne $trusted.Thumbprint) { throw "$file isn't signed with $driverDir/luzvda.cer" }
          }

          # Apollo talks to the driver through the same protocol header, line endings aside
          $released = (Get-Content -Raw "$extracted/luzvda-ioctl.h") -replace "`r`n", "`n"
          $ours = (Get-Content -Raw 'third-party/luzvda/luzvda-ioctl.h') -replace "`r`n", "`n"
          if ($released -ne $ours) { throw "third-party/luzvda/luzvda-ioctl.h differs from the one in $env:LUZVDA_RELEASE" }

          foreach ($file in 'LuzVDA.inf', 'LuzVDA.dll', 'luzvda.cat', 'luzvda-ctl.exe') { Copy-Item "$extracted/$file" $driverDir }
          Get-ChildItem $driverDir | Format-Table Name, Length

      # MSYS2's nodejs crashes on startup (gcc-16 libstdc++ regression), so use the official build.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: lts/*

      - name: Locate Node.js
        shell: pwsh
        run: |
          $nodeDir = Split-Path (Get-Command node).Source
          "NODE_DIR=$nodeDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Boost is left out on purpose: the build needs exactly 1.89.0 and fetches it itself.
      - name: Setup MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nlohmann_json
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-zlib

      # Fork code that doesn't need the rest of Apollo: the clipboard bundle and trackpad frames
      # (shared with LuzLunar), a round trip through the real Windows clipboard, and gestures on a
      # real synthetic touchpad; the last two skip if the runner has no clipboard or touchpads.
      - name: Fork unit tests
        shell: msys2 {0}
        run: |
          # Stop at the first failing test or header, whatever flags the MSYS2 shell runs with
          set -eo pipefail
          g++ -std=c++17 -Wall -Wextra -DCLIPBUNDLE_WITH_ZLIB -Isrc/fork \
            tests/fork/clipbundle_test.cpp src/fork/clipbundle.cpp -lz -o clipbundle_test
          ./clipbundle_test
          # Trackpad passthrough frames, also shared with LuzLunar (the same test runs in its CI)
          g++ -std=c++17 -Wall -Wextra -Isrc/fork tests/fork/luztouchpad_test.cpp -o luztouchpad_test
          ./luztouchpad_test
          g++ -std=c++17 -Wall -DCLIPBUNDLE_WITH_ZLIB -Isrc/fork \
            tests/fork/clipboard_win_smoke.cpp src/fork/clipboard_win.cpp src/fork/clipbundle.cpp \
            -lz -lole32 -luser32 -o clipboard_win_smoke
          ./clipboard_win_smoke
          # A real synthetic touchpad playing trackpad passthrough's gestures; skips where Windows has none.
          # Static, so the uploaded copy runs on a PC without MSYS2.
          g++ -std=c++17 -Wall -static -Isrc/fork tests/fork/touchpad_win_smoke.cpp -luser32 -o touchpad_win_smoke
          ./touchpad_win_smoke
          # Header-only fork code; each test is a program of its own
          for test in tests/fork/header/*_test.cpp; do
            name=$(basename "$test" .cpp)
            g++ -std=c++23 -Wall -Wextra -iquote src -Ithird-party "$test" -lcrypto -o "$name"
            "./$name"
          done
          # Each fork header on its own with the build's include paths (the repository root and
          # third-party; the tests above also have src/), so one that builds only in the tests fails here
          for header in src/fork/*.h; do
            echo "#include \"$header\"" | g++ -std=c++23 -fsyntax-only -iquote . -Ithird-party -x c++ -
          done

      - name: Build
        shell: msys2 {0}
        env:
          BRANCH: ${{ github.ref_name }}
          CLONE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          export PATH="$PATH:$(cygpath -u "$NODE_DIR")"
          node --version
          gcc --version | head -n 1
          cmake --version | head -n 1

          # CMAKE_POLICY_VERSION_MINIMUM lets CMake 4 configure submodules that still declare CMake < 3.5
          cmake -B build -G Ninja -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=OFF
          ninja -C build

      - name: Package
        shell: msys2 {0}
        run: |
          cd build
          cpack -G NSIS
          cpack -G ZIP

          mkdir -p ../artifacts
          mv ./cpack_artifacts/Apollo.exe ../artifacts/Apollo-windows-installer.exe
          mv ./cpack_artifacts/Apollo.zip ../artifacts/Apollo-windows-portable.zip
          cd ../artifacts
          sha256sum Apollo-windows-installer.exe Apollo-windows-portable.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Check driver is packaged
        shell: pwsh
        run: |
          $files = 'LuzVDA.inf', 'LuzVDA.dll', 'luzvda.cat', 'luzvda-ctl.exe', 'luzvda.cer', 'install.bat', 'uninstall.bat'
          foreach ($package in 'Apollo-windows-installer.exe', 'Apollo-windows-portable.zip') {
            $listing = 7z l "artifacts/$package"
            foreach ($file in $files) {
              if (-not ($listing -match "drivers\\luzvda\\$([regex]::Escape($file))")) { throw "$package is missing drivers\luzvda\$file" }
            }
          }
          "Both packages include the LuzVDA driver: $($files -join ', ')"

      # Lets anyone check a downloaded installer came from this workflow:
      #   gh attestation verify Apollo-windows-installer.exe -R anyosag/Apollo
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            artifacts/Apollo-windows-installer.exe
            artifacts/Apollo-windows-portable.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: Apollo-windows-${{ env.BUILD_VERSION }}
          path: artifacts/
          if-no-files-found: error

      # The touchpad smoke test from the fork unit test step, to run by hand on a PC (see FORK.md)
      - name: Upload the touchpad smoke test
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: Apollo-touchpad-smoke-${{ env.BUILD_VERSION }}
          path: touchpad_win_smoke.exe
          if-no-files-found: warn

  # Over-the-air updates (FORK.md, "Updates"): each master build becomes a GitHub release with an
  # update.json that Apollo checks against the public key in src/fork/update_key.h. The signing key
  # is the FORK_UPDATE_KEY secret of the `release` environment, which only master may use.
  publish:
    name: Publish update
    needs: build_windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write  # create the release
    concurrency:
      group: publish-update
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          sparse-checkout: src/fork/update_key.h
          sparse-checkout-cone-mode: false

      - name: Download the build
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: Apollo-windows-${{ needs.build_windows.outputs.version }}
          path: artifacts

      - name: Write and sign update.json
        id: sign
        env:
          FORK_UPDATE_KEY: ${{ secrets.FORK_UPDATE_KEY }}
          RUN: ${{ github.run_number }}
          VERSION: ${{ needs.build_windows.outputs.version }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "$FORK_UPDATE_KEY" ]; then
            echo "::warning::The release environment has no FORK_UPDATE_KEY secret, so this build isn't published as an update (FORK.md, \"Updates\")"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd artifacts
          file=Apollo-windows-installer.exe
          tag="apollo-b$RUN"
          notes="${HEAD_MESSAGE%%$'\n'*}"
          notes="${notes:0:500}"
          jq -n \
            --argjson run "$RUN" --arg version "$VERSION" --arg commit "$COMMIT" \
            --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg notes "$notes" \
            --arg name "$file" --arg url "https://github.com/$REPO/releases/download/$tag/$file" \
            --arg sha256 "$(sha256sum "$file" | cut -d' ' -f1)" --argjson size "$(stat -c %s "$file")" \
            '{product: "apollo", channel: "master", run: $run, version: $version, commit: $commit,
              published: $published, notes: $notes,
              asset: {name: $name, url: $url, sha256: $sha256, size: $size}}' > update.json
          cat update.json

          key="$RUNNER_TEMP/update-key.pem"
          (umask 077; printf '%s\n' "$FORK_UPDATE_KEY" > "$key")
          openssl pkeyutl -sign -inkey "$key" -rawin -in update.json -out "$RUNNER_TEMP/update.sig"
          rm -f "$key"
          base64 -w0 "$RUNNER_TEMP/update.sig" > update.json.sig

          # The secret must match the public key Apollo has, or every Apollo would refuse this update
          hex=$(grep -o '0x[0-9a-f][0-9a-f]' ../src/fork/update_key.h | head -n 32 | sed 's/0x//' | tr -d '\n')
          { echo '-----BEGIN PUBLIC KEY-----'; echo "302a300506032b6570032100$hex" | xxd -r -p | base64; echo '-----END PUBLIC KEY-----'; } > "$RUNNER_TEMP/update-pub.pem"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/update-pub.pem" -rawin -in update.json -sigfile "$RUNNER_TEMP/update.sig"

          {
            echo "publish=true"
            echo "tag=$tag"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"

      - name: Create the release
        if: steps.sign.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.sign.outputs.tag }}
          NOTES: ${{ steps.sign.outputs.notes }}
          VERSION: ${{ needs.build_windows.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd artifacts
          files=(Apollo-windows-installer.exe Apollo-windows-portable.zip SHA256SUMS.txt update.json update.json.sig)
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"
          else
            gh release create "$TAG" --repo "$REPO" --target "$COMMIT" --title "Apollo $VERSION" \
              --notes "$NOTES" --latest "${files[@]}"
          fi

          # Keep the newest 15 updates; older ones are no longer needed to roll back to
          gh release list --repo "$REPO" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("apollo-b"))] | sort_by(.createdAt) | reverse | .[15:] | .[].tagName' |
          while read -r old; do
            echo "Removing $old"
            gh release delete "$old" --repo "$REPO" --yes --cleanup-tag
          done
