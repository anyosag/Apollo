---
# Builds the Windows installer and portable zip from the current source,
# following the steps in docs/building.md.
name: Build Windows

on:
  push:
    branches:
      - master
      - 'claude/**'
  workflow_dispatch:
  # Used by sync-upstream.yml, since pushes made with GITHUB_TOKEN don't trigger workflows.
  workflow_call:
    inputs:
      ref:
        description: Commit to build (defaults to the commit that triggered the run)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: recursive

      # Version is the latest upstream release plus the number of commits since it,
      # e.g. 0.4.8.26, so Apollo's update check compares correctly against upstream releases.
      - name: Determine version
        shell: bash
        run: |
          git fetch --quiet --tags https://github.com/ClassicOldSong/Apollo.git
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*')
          version="${tag#v}.$(git rev-list --count "$tag..HEAD")"
          echo "Building version $version"
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # The SudoVDA virtual display driver's binaries (SudoVDA.dll, nefconc.exe) aren't in the source tree
      # (*.dll is gitignored); upstream adds them by hand when building releases. Without them the installer
      # ships an incomplete driver and Apollo has no virtual display, so take them from an official release.
      - name: Add SudoVDA driver binaries
        shell: pwsh
        env:
          SUDOVDA_RELEASE: v0.4.6
          SUDOVDA_INSTALLER_SHA256: 42b2aefaacb3474511517a56b96ee9f0517f30ac38b5dd2fda9fd5b478f5021a
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'apollo-release.exe'
          $extracted = Join-Path $env:RUNNER_TEMP 'sudovda'
          $version = $env:SUDOVDA_RELEASE.TrimStart('v')
          Invoke-WebRequest "https://github.com/ClassicOldSong/Apollo/releases/download/$env:SUDOVDA_RELEASE/Apollo-$version.exe" -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:SUDOVDA_INSTALLER_SHA256) { throw "Apollo $env:SUDOVDA_RELEASE installer has unexpected SHA256 $hash" }

          7z e $installer 'drivers\sudovda\*' "-o$extracted" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z couldn't extract the driver from the Apollo $env:SUDOVDA_RELEASE installer" }

          # The binaries are signed against the catalog in the source tree; if upstream updates the driver,
          # they no longer match and Windows would reject it, so fail here instead.
          $driverDir = 'src_assets/windows/drivers/sudovda'
          foreach ($file in 'SudoVDA.inf', 'sudovda.cat', 'sudovda.cer') {
            if ((Get-FileHash "$extracted/$file").Hash -ne (Get-FileHash "$driverDir/$file").Hash) {
              throw "$file differs from Apollo $env:SUDOVDA_RELEASE. Set SUDOVDA_RELEASE to a release with the same driver."
            }
          }
          foreach ($file in 'SudoVDA.dll', 'nefconc.exe') { Copy-Item "$extracted/$file" $driverDir }
          Get-ChildItem $driverDir | Format-Table Name, Length

      # MSYS2's nodejs crashes on startup (gcc-16 libstdc++ regression), so use the official build.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Locate Node.js
        shell: pwsh
        run: |
          $nodeDir = Split-Path (Get-Command node).Source
          "NODE_DIR=$nodeDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Boost is left out on purpose: the build needs exactly 1.89.0 and fetches it itself.
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nlohmann_json
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-zlib

      # Fork code that doesn't need the rest of Apollo: the clipboard bundle (shared with LuzLunar)
      # and a round trip through the real Windows clipboard, which skips if the runner has none.
      - name: Fork unit tests
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -Wall -Wextra -DCLIPBUNDLE_WITH_ZLIB -Isrc/fork \
            tests/fork/clipbundle_test.cpp src/fork/clipbundle.cpp -lz -o clipbundle_test
          ./clipbundle_test
          g++ -std=c++17 -Wall -DCLIPBUNDLE_WITH_ZLIB -Isrc/fork \
            tests/fork/clipboard_win_smoke.cpp src/fork/clipboard_win.cpp src/fork/clipbundle.cpp \
            -lz -lole32 -luser32 -o clipboard_win_smoke
          ./clipboard_win_smoke
          # Checks on what clients send, in header-only code; each test is a program of its own
          for test in tests/fork/header/*_test.cpp; do
            name=$(basename "$test" .cpp)
            g++ -std=c++23 -Wall -Wextra -iquote src -Ithird-party "$test" -lcrypto -o "$name"
            "./$name"
          done

      - name: Build
        shell: msys2 {0}
        env:
          BRANCH: ${{ github.ref_name }}
          CLONE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          export PATH="$PATH:$(cygpath -u "$NODE_DIR")"
          node --version
          gcc --version | head -n 1
          cmake --version | head -n 1

          # CMAKE_POLICY_VERSION_MINIMUM lets CMake 4 configure submodules that still declare CMake < 3.5
          cmake -B build -G Ninja -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=OFF
          ninja -C build

      - name: Package
        shell: msys2 {0}
        run: |
          cd build
          cpack -G NSIS
          cpack -G ZIP

          mkdir -p ../artifacts
          mv ./cpack_artifacts/Apollo.exe ../artifacts/Apollo-windows-installer.exe
          mv ./cpack_artifacts/Apollo.zip ../artifacts/Apollo-windows-portable.zip
          cd ../artifacts
          sha256sum Apollo-windows-installer.exe Apollo-windows-portable.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Check driver is packaged
        shell: pwsh
        run: |
          foreach ($package in 'Apollo-windows-installer.exe', 'Apollo-windows-portable.zip') {
            $listing = 7z l "artifacts/$package"
            foreach ($file in 'SudoVDA.dll', 'nefconc.exe') {
              if (-not ($listing -match "drivers\\sudovda\\$([regex]::Escape($file))")) { throw "$package is missing drivers\sudovda\$file" }
            }
          }
          "Both packages include SudoVDA.dll and nefconc.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: Apollo-windows-${{ env.BUILD_VERSION }}
          path: artifacts/
          if-no-files-found: error
