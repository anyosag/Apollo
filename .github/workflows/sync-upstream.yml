---
# Once a day, merges new commits from ClassicOldSong/Apollo into the upstream-sync branch, opens (or
# updates) a pull request from it into master, and builds an installer from the merge. Nothing reaches
# master until that pull request is merged, so upstream changes get a look before they ship.
#
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
name: Sync upstream

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      build:
        description: Build an installer even if upstream has no new commits
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/ClassicOldSong/Apollo.git
  SYNC_BRANCH: upstream-sync

jobs:
  sync:
    name: Merge upstream master
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the sync branch
      pull-requests: write  # open the sync pull request
      actions: write  # keep this schedule enabled
    outputs:
      updated: ${{ steps.merge.outputs.updated }}
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          git fetch --quiet "$UPSTREAM" master
          upstream=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$upstream" HEAD; then
            echo "master already contains upstream $(git rev-parse --short "$upstream")."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Already proposed: the sync branch has this upstream commit on top of today's master
          if git rev-parse --quiet --verify "origin/$SYNC_BRANCH" > /dev/null &&
             git merge-base --is-ancestor "$upstream" "origin/$SYNC_BRANCH" &&
             git merge-base --is-ancestor HEAD "origin/$SYNC_BRANCH"; then
            echo "$SYNC_BRANCH already has upstream $(git rev-parse --short "$upstream") on top of master."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse "origin/$SYNC_BRANCH")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New upstream commits:"
          git log --oneline HEAD.."$upstream"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          if ! git merge --no-edit -m "Merge upstream ClassicOldSong/Apollo master" "$upstream"; then
            git diff --name-only --diff-filter=U
            echo "::error::Upstream changes conflict with this fork's changes in the files above. Merge $UPSTREAM master into a branch from master by hand and open a pull request."
            exit 1
          fi
          # The branch is rebuilt from master each time, so it's replaced rather than added to,
          # but only if nobody else pushed to it since checkout
          expected=$(git rev-parse --quiet --verify "origin/$SYNC_BRANCH" || true)
          git push --force-with-lease="$SYNC_BRANCH:$expected" origin "HEAD:refs/heads/$SYNC_BRANCH"

          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.merge.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/pr-body.md"
          {
            echo "Merges new commits from [ClassicOldSong/Apollo](https://github.com/ClassicOldSong/Apollo) master."
            echo
            echo "The installer for this merge is built by [the sync run]($RUN_URL); pull requests opened by GitHub Actions don't start the usual checks."
            echo
            echo "Look over the upstream changes, then merge with **Create a merge commit** (not squash or rebase) so master keeps upstream's history. Don't push to \`$SYNC_BRANCH\`: the next sync replaces it."
            echo
            echo "### New upstream commits"
            echo
            echo '```'
            git log --oneline --no-decorate HEAD^1..HEAD^2 | head -n 200
            echo '```'
          } > "$body"

          number=$(gh pr list --head "$SYNC_BRANCH" --base master --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$body"
          elif ! gh pr create --base master --head "$SYNC_BRANCH" --title "Merge upstream ClassicOldSong/Apollo" --body-file "$body"; then
            echo "::error::Couldn't open the pull request. Turn on Settings > Actions > General > \"Allow GitHub Actions to create and approve pull requests\", or open one from $SYNC_BRANCH by hand."
            exit 1
          fi

      # GitHub disables scheduled workflows in public repos after 60 days without activity.
      - name: Keep schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/sync-upstream.yml/enable"

  build:
    name: Build installer
    needs: sync
    if: needs.sync.outputs.updated == 'true' || inputs.build
    permissions:
      contents: read
      id-token: write  # sign the build provenance
      attestations: write  # store it
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
